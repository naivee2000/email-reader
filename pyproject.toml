[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "private-email-reader"
version = "0.1.0"
description = "A private, encrypted Gmail and Outlook desktop assistant for macOS."
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = { text = "Proprietary" }
authors = [{ name = "Email Reader" }]
dependencies = [
  "PySide6>=6.8,<7",
  "cryptography>=44,<47",
  "keyring>=25,<27",
  "openai>=2.24,<3",
  "pydantic>=2.10,<3",
  "google-api-python-client>=2.160,<3",
  "google-auth-oauthlib>=1.2,<2",
  "msal>=1.31,<2",
  "httpx>=0.28,<1",
  "pypdf>=5,<7",
  "PyMuPDF>=1.25,<2",
  "python-docx>=1.1,<2",
  "openpyxl>=3.1,<4",
  "python-pptx>=1.0,<2",
  "beautifulsoup4>=4.12,<5",
  "platformdirs>=4.3,<5",
  "pyobjc-framework-Vision>=11.1,<13; sys_platform == 'darwin'",
]

[project.optional-dependencies]
sqlcipher = ["sqlcipher3>=0.5.4,<1"]
dev = [
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "pytest-asyncio>=0.25,<2",
  "ruff>=0.9,<1",
  "mypy>=1.14,<2",
  "pyinstaller>=6.11,<7",
]

[project.scripts]
email-reader = "email_reader.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/email_reader"]

[tool.hatch.build]
include = [
  "src/email_reader/**/*.py",
  "src/email_reader/qml/*.qml",
  "src/email_reader/qml/*.js",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["build", "dist", "data", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["email_reader"]
